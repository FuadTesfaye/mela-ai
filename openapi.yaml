          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  pattern: ^\+[1-9][0-9]{7,14}$
                text:
                  type: string
                  maxLength: 2000
                  minLength: 1
              required:
                - from
                - text
      security:
        - smsGatewayToken: []
      description:
        "Plain text capped at 160 Unicode codepoints, not necessarily one carrier SMS segment.
        Commands: HELP, CONFIRMHELP, VERIFY <code>, STOP, AM, EN. Gateway is responsible for delivering
        the HTTP response."
