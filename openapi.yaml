  /sms/inbound:
    post:
      summary: Receive a trusted text-gateway request
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        '400':
          description: Invalid fields or JSON
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        '401':
          description: Authentication required
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        '403':
          description: Origin or role rejected
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        '413':
          description: Request too large
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        '429':
          description: Rate limit exceeded
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        '503':
          description: Service unavailable or unconfigured
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  pattern: ^\+[1-9][0-9]{7,14}$
                text:
                  type: string
                  maxLength: 2000
                  minLength: 1
              required:
              - from
              - text
      security:
      - smsGatewayToken: []
      description: 'Plain text capped at 160 Unicode codepoints, not necessarily one
        carrier SMS segment. Commands: HELP, CONFIRMHELP, VERIFY <code>, STOP, AM,
        EN. Gateway is responsible for delivering the HTTP response.'
