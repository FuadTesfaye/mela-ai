components:
  securitySchemes:
    tutorSession:
      type: apiKey
      in: cookie
      name: mela_session
    ticketToken:
      type: http
      scheme: bearer
      description: Ticket-specific secret returned at creation.
    subscriptionToken:
      type: http
      scheme: bearer
      description: Subscription-specific secret returned at opt-in.
    smsGatewayToken:
      type: http
      scheme: bearer
      description: Configured SMS_INBOUND_SECRET.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          maxLength: 2000
      required:
      - error
    Section:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 300
        content:
          type: string
          maxLength: 6000
        url:
          type: string
          maxLength: 2000
        language:
          type: string
          enum:
          - en
          - am
          default: en
        courseId:
          type: string
          maxLength: 100
        keywords:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 30
      required:
      - id
      - title
      - content
      - url
    LearningContext:
      type: object
      properties:
        pageType:
          type: string
          enum:
          - dashboard
          - lesson
          - jobs
          - unknown
        courseId:
          type: string
          maxLength: 100
        courseTitle:
          type: string
          maxLength: 300
        moduleTitle:
          type: string
          maxLength: 300
        lessonTitle:
          type: string
          maxLength: 300
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
          maxItems: 30
      required:
      - pageType
      - sections
    Citation:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 300
        url:
          type: string
          maxLength: 2000
        excerpt:
          type: string
          maxLength: 240
      required:
      - id
      - title
      - url
      - excerpt
    Ask:
      type: object
      properties:
        question:
          type: string
          maxLength: 2000
          minLength: 1
        language:
          type: string
          enum:
          - en
          - am
          default: en
        context:
          $ref: '#/components/schemas/LearningContext'
        cloudConsent:
          type: boolean
          default: false
        simple:
          type: boolean
          default: false
      required:
      - question
    Answer:
      type: object
      properties:
        answer:
          type: string
          maxLength: 18000
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          maxItems: 3
        provider:
          type: string
          enum:
          - none
          - local
          - cloud
        matched:
          type: boolean
        actions:
          type: array
          items:
            type: string
            maxLength: 2000
          maxItems: 10
      required:
      - answer
      - citations
      - provider
      - matched
      - actions
    TicketCreate:
      type: object
      properties:
        language:
          type: string
          enum:
          - en
          - am
          default: en
        consent:
          type: boolean
          enum:
          - true
        conversation:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                - user
                - assistant
                - tutor
              content:
                type: string
                maxLength: 12000
            required:
            - role
            - content
          maxItems: 100
        context:
          $ref: '#/components/schemas/LearningContext'
        screenshot:
          type: string
          maxLength: 2800000
          description: PNG, JPEG, or WebP data URL; decoded size at most 2 MiB. Magic
            bytes are checked.
        kind:
          type: string
          enum:
          - learning
          - accommodation
          default: learning
      required:
      - consent
    TicketCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          maxLength: 100
        status:
          type: string
          enum:
          - queued
      required:
      - id
      - token
      - status
    TutorMessage:
      type: object
      properties:
        id:
          type: string
          maxLength: 50
        content:
          type: string
          maxLength: 6000
        created_at:
          type: string
          format: date-time
      required:
      - id
      - content
    TicketDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - active
          - resolved
        language:
          type: string
          enum:
          - en
          - am
          default: en
        kind:
          type: string
          maxLength: 30
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TutorMessage'
          maxItems: 1000
        conversation:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                - user
                - assistant
                - tutor
              content:
                type: string
                maxLength: 12000
            required:
            - role
            - content
          maxItems: 100
        context:
          $ref: '#/components/schemas/LearningContext'
        hasScreenshot:
          type: boolean
      required:
      - id
      - status
      - messages
    Job:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 300
        company:
          type: string
          maxLength: 300
        location:
          type: string
          maxLength: 300
        type:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 6000
        accommodations:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 30
        keywords:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 30
      required:
      - id
      - title
      - description
    Signal:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - offer
            - answer
          sdp:
            type: string
            maxLength: 50000
        required:
        - type
        - sdp
      - type: object
        properties:
          type:
            type: string
            enum:
            - ice
          candidate:
            type: object
            properties:
              candidate:
                type: string
                maxLength: 3000
              sdpMid:
                type: string
                nullable: true
              sdpMLineIndex:
                type: integer
                nullable: true
              usernameFragment:
                type: string
                nullable: true
            required:
            - candidate
        required:
        - type
        - candidate
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
