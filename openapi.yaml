  /api/internal/jobs:
    post:
      summary: Run a bounded batch of channel and webhook delivery jobs
      security:
        - operationsToken: []
      responses:
        '200':
          description: Bounded batch processed; individual delivery failures remain retryable
        '401':
          description: Missing or incorrect operations bearer token
        '503':
          description: Not configured or storage unavailable
  /api/telegram/webhook:
    post:
      summary: Durably queue authenticated private-chat Telegram updates
      parameters:
        - in: header
          name: X-Telegram-Bot-Api-Secret-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [update_id]
              properties:
                update_id:
                  type: integer
                message:
                  type: object
      responses:
        '200':
          description: Received or already queued
        '401':
          description: Webhook secret rejected
        '503':
          description: Not configured or storage unavailable
components:
  securitySchemes:
    operationsToken:
      type: http
      scheme: bearer
      description: Server-only OPS_SECRET.
    tutorSession:
      type: apiKey
      in: cookie
      name: mela_session
    ticketToken:
      type: http
      scheme: bearer
      description: Ticket-specific secret returned at creation.
    subscriptionToken:
      type: http
      scheme: bearer
      description: Subscription-specific secret returned at opt-in.
    smsGatewayToken:
      type: http
      scheme: bearer
      description: Configured SMS_INBOUND_SECRET.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          maxLength: 2000
      required:
        - error
    Section:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 300
        content:
          type: string
          maxLength: 6000
        url:
          type: string
          maxLength: 2000
        language:
          type: string
          enum:
          - en
          - am
          - om
          - ti
          default: en
        courseId:
          type: string
          maxLength: 100
        keywords:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 30
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
      required:
      - id
      - title
      - content
      - url
    LearningContext:
      type: object
      properties:
        pageType:
          type: string
          enum:
            - dashboard
            - lesson
            - jobs
            - unknown
        courseId:
          type: string
          maxLength: 100
        courseTitle:
          type: string
          maxLength: 300
        moduleTitle:
          type: string
          maxLength: 300
        lessonTitle:
          type: string
          maxLength: 300
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
          maxItems: 30
        video:
          $ref: "#/components/schemas/VideoSnapshot"
      required:
        - pageType
        - sections
    Citation:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 300
        url:
          type: string
          maxLength: 2000
        excerpt:
          type: string
          maxLength: 240
      required:
        - id
        - title
        - url
        - excerpt
    Ask:
      type: object
      properties:
        question:
          type: string
          maxLength: 2000
          minLength: 1
        language:
          type: string
          enum:
          - en
          - am
          - om
          - ti
          default: en
        context:
          $ref: '#/components/schemas/LearningContext'
        cloudConsent:
          type: boolean
          default: false
        simple:
          type: boolean
          default: false
        scope:
          type: string
          enum:
          - lesson
          - wholeVideo
          - moment
          default: lesson
        includeVisualContext:
          type: boolean
          default: false
          description: Requires cloudConsent, moment scope and Gemini; sends the actual
            30-second public video segment.
        explanationMode:
          type: string
          enum:
          - auto
          - simple
          - example
          - steps
          - diagram
      required:
      - question
    Answer:
      type: object
      properties:
        answer:
          type: string
          maxLength: 18000
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
          maxItems: 4
        provider:
          type: string
          enum:
            - none
            - local
            - cloud
            - gemini
        matched:
          type: boolean
        actions:
          type: array
          items:
            type: string
            maxLength: 2000
          maxItems: 10
        notice:
          type: string
          description: Explains an AI failure when source text is shown instead.
        summary:
          type: string
        blocks:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/ExplanationBlock"
        language:
          type: string
          enum:
            - en
            - am
        translationStatus:
          type: string
          description: Provenance or fallback notice for an Amharic answer.
      required:
        - answer
        - citations
        - provider
        - matched
        - actions
    TicketCreate:
      type: object
      properties:
        language:
          type: string
          enum:
          - en
          - am
          - om
          - ti
          default: en
        consent:
          type: boolean
          enum:
          - true
        conversation:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                - user
                - assistant
                - tutor
              content:
                type: string
                maxLength: 12000
            required:
            - role
            - content
          maxItems: 100
        context:
          $ref: '#/components/schemas/LearningContext'
        screenshot:
          type: string
          maxLength: 2800000
          description: PNG, JPEG, or WebP data URL; decoded size at most 2 MiB. Magic
            bytes are checked.
        kind:
          type: string
          enum:
          - learning
          - accommodation
          default: learning
      required:
      - consent
    TicketCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          maxLength: 100
        status:
          type: string
          enum:
            - queued
      required:
        - id
        - token
        - status
    TutorMessage:
      type: object
      properties:
        id:
          type: string
          maxLength: 50
        content:
          type: string
          maxLength: 6000
        created_at:
          type: string
          format: date-time
      required:
        - id
        - content
    TicketDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - active
            - resolved
        language:
          type: string
          enum:
            - en
            - am
          default: en
        kind:
          type: string
          maxLength: 30
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TutorMessage"
          maxItems: 1000
        conversation:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - user
                  - assistant
                  - tutor
              content:
                type: string
                maxLength: 12000
            required:
              - role
              - content
          maxItems: 100
        context:
          $ref: "#/components/schemas/LearningContext"
        hasScreenshot:
          type: boolean
      required:
        - id
        - status
        - messages
    Job:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 300
        company:
          type: string
          maxLength: 300
        location:
          type: string
          maxLength: 300
        type:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 6000
        accommodations:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 30
        keywords:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 30
      required:
        - id
        - title
        - description
    Signal:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - offer
                - answer
            sdp:
              type: string
              maxLength: 50000
          required:
            - type
            - sdp
        - type: object
          properties:
            type:
              type: string
              enum:
                - ice
            candidate:
              type: object
              properties:
                candidate:
                  type: string
                  maxLength: 3000
                sdpMid:
                  type: string
                  nullable: true
                sdpMLineIndex:
                  type: integer
                  nullable: true
                usernameFragment:
                  type: string
                  nullable: true
              required:
                - candidate
          required:
            - type
            - candidate
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    Transcript:
      type: object
      required:
        - title
        - language
        - cues
        - videoUrl
        - generated
      properties:
        title:
          type: string
          maxLength: 200
        language:
          type: string
          enum:
            - en
        generated:
          type: boolean
          enum:
            - true
        videoUrl:
          type: string
          format: uri
        cues:
          type: array
          minItems: 1
          maxItems: 240
          items:
            type: object
            required:
              - start
              - end
              - text
            properties:
              start:
                type: number
                minimum: 0
                maximum: 14400
              end:
                type: number
                minimum: 0
                maximum: 14400
              text:
                type: string
                maxLength: 1500
    VideoSnapshot:
      type: object
      required:
        - videoId
        - url
        - title
        - currentTime
        - duration
      properties:
        videoId:
          type: string
          pattern: ^[-_a-zA-Z0-9]{11}$
        url:
          type: string
        title:
          type: string
        currentTime:
          type: number
          minimum: 0
        duration:
          type: number
          minimum: 0
        transcriptRevision:
          type: string
    ExplanationBlock:
      type: object
      description:
        Bounded structured data rendered locally; never model HTML, SVG or code. Graph IDs
        must be unique and edge endpoints valid. Every sourceId must reference an answer citation.
      required:
        - type
        - sourceIds
      properties:
        type:
          type: string
          enum:
            - paragraph
            - example
            - steps
            - diagram
        text:
          type: string
        items:
          type: array
          maxItems: 8
          items:
            type: string
        title:
          type: string
        description:
          type: string
        nodes:
          type: array
          maxItems: 8
          items:
            type: object
            required:
              - id
              - label
            properties:
              id:
                type: string
              label:
                type: string
        edges:
          type: array
          maxItems: 12
          items:
            type: object
            required:
              - from
              - to
            properties:
              from:
                type: string
              to:
                type: string
              label:
                type: string
        sourceIds:
          type: array
          maxItems: 4
          items:
            type: string
    SigningDraft:
      type: object
      required:
        - videoUrl
        - interpreter
        - publicationConsent
        - sourceDuration
        - duration
      properties:
        videoUrl:
          type: string
          format: uri
        interpreter:
          type: string
          minLength: 2
          maxLength: 150
        publicationConsent:
          type: boolean
          enum:
            - true
        sourceDuration:
          type: number
          minimum: 0
          maximum: 14400
        duration:
          type: number
          minimum: 0
          maximum: 14400
        offsetSeconds:
          type: number
          minimum: -30
          maximum: 30
    SigningReview:
      type: object
      required:
        - action
      description:
        submit requires an uploaded draft. approve requires a different declared reviewer,
        complete source coverage, offset, and every human review check true. reject requires reviewer
        and correction notes. archive unpublishes an approved track. Shared tutor authentication does
        not independently verify reviewer identity or fluency.
      properties:
        action:
          type: string
          enum:
            - submit
            - approve
            - reject
            - archive
        reviewer:
          type: string
          minLength: 2
        notes:
          type: string
          maxLength: 3000
        offsetSeconds:
          type: number
          minimum: -30
          maximum: 30
        checks:
          type: object
          required:
            - fluentEthSL
            - accurateMeaning
            - visibleHandsAndFace
            - synchronized
            - completeCoverage
          properties:
            fluentEthSL:
              type: boolean
              enum:
                - true
            accurateMeaning:
              type: boolean
              enum:
                - true
            visibleHandsAndFace:
              type: boolean
              enum:
                - true
            synchronized:
              type: boolean
              enum:
                - true
            completeCoverage:
              type: boolean
              enum:
                - true
