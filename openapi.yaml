      responses:
        "200":
          description: Success
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        "400":
          description: Invalid fields or JSON
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        "401":
          description: Authentication required
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        "403":
          description: Origin or role rejected
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        "413":
          description: Request too large
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        "429":
          description: Rate limit exceeded
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
        "503":
          description: Service unavailable or unconfigured
          content:
            text/plain:
              schema:
                type: string
                maxLength: 160
      requestBody:
        required: true
