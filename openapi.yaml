openapi: 3.0.3
info:
  title: MELA AI API
  version: 0.1.0
  description: Accessible learning companion. One public demo catalogue; bearer-protected
    learner tickets and cookie-protected tutor tools. Browser origins must be allowlisted.
    Errors expose no credentials or database details.
servers:
- url: http://localhost:3000
  description: Local development; replace with your HTTPS deployment origin
paths:
  /api/v1/ask:
    post:
      summary: Answer from retrieved sources
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ask'
      description: 'No generative call without retrieved evidence. Cloud mode requires
        cloudConsent=true. Provider errors or invalid citation IDs fall back to source
        extracts. Request limit: 250,000 bytes.'
    options:
      summary: CORS preflight
      responses:
        '204':
          description: Allowed origin; methods and headers returned
        '403':
          description: Origin rejected
  /api/v1/content:
    post:
      summary: Index approved public learning sections
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  indexed:
                    type: integer
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 100
                      title:
                        type: string
                        maxLength: 300
                      content:
                        type: string
                        maxLength: 6000
                      url:
                        type: string
                        maxLength: 2000
                      language:
                        type: string
                        enum:
                        - en
                        - am
                        default: en
                      courseId:
                        type: string
                        maxLength: 100
                      keywords:
                        type: array
                        items:
                          type: string
                          maxLength: 80
                        maxItems: 30
                    required:
                    - id
                    - title
                    - content
                    - url
                    - language
                  maxItems: 100
              required:
              - sections
      security:
      - tutorSession: []
      description: 'Upserts by section id. Same-origin tutor request required. Public
        catalogue only; not tenant-isolated. Request limit: 700,000 bytes.'
    options:
      summary: CORS preflight
      responses:
        '204':
          description: Allowed origin; methods and headers returned
        '403':
          description: Origin rejected
  /api/v1/escalations:
    post:
      summary: Create a consented human-help ticket
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCreated'
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      description: 'Ticket token is returned once; keep it private. Widget keeps it
        in memory. Request limit: 5,000,000 bytes.'
    get:
      summary: List the latest 100 support tickets
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        language:
                          type: string
                          enum:
                          - en
                          - am
                          default: en
                        status:
                          type: string
                          maxLength: 30
                        kind:
                          type: string
                          maxLength: 30
                        created_at:
                          type: string
                          format: date-time
                    maxItems: 100
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - tutorSession: []
    options:
      summary: CORS preflight
      responses:
        '204':
          description: Allowed origin; methods and headers returned
        '403':
          description: Origin rejected
  /api/v1/escalations/{id}:
    get:
      summary: Read ticket status and tutor replies
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - tutorSession: []
      - ticketToken: []
      description: 'Conversation, context and hasScreenshot are returned only to authenticated
        tutors. Missing ticket: 404.'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Reply or change ticket status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - queued
                  - active
                  - resolved
                reply:
                  type: string
                  maxLength: 6000
                  minLength: 1
      security:
      - tutorSession: []
      description: Supply status or reply. Resolving a ticket terminates active sharing
        sessions.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    options:
      summary: CORS preflight
      responses:
        '204':
          description: Allowed origin; methods and headers returned
        '403':
          description: Origin rejected
  /api/v1/escalations/{id}/screenshot:
    get:
      summary: Read a private, consented screenshot
      responses:
        '200':
          description: Success
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - tutorSession: []
      description: 'Returns image/png, image/jpeg or image/webp. No screenshot: 404.'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    options:
      summary: CORS preflight
      responses:
        '204':
          description: Allowed origin; methods and headers returned
        '403':
          description: Origin rejected
  /api/v1/escalations/{id}/shares:
    get:
      summary: Find the current learner sharing session
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: uuid
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - tutorSession: []
      - ticketToken: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Start learner-controlled sharing
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  iceServers:
                    type: array
                    items:
                      type: object
                    maxItems: 10
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ticketToken: []
      description: Requires learner token. Stops prior sessions. Browser capture consent
        is handled in the widget. Sessions expire after 30 minutes.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    options:
      summary: CORS preflight
      responses:
        '204':
          description: Allowed origin; methods and headers returned
        '403':
          description: Origin rejected
  /api/v1/shares/{id}:
    get:
      summary: Read session status and ICE configuration
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  iceServers:
                    type: array
                    items:
                      type: object
                    maxItems: 10
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - tutorSession: []
      - ticketToken: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Stop sharing
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - tutorSession: []
      - ticketToken: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    options:
      summary: CORS preflight
      responses:
        '204':
          description: Allowed origin; methods and headers returned
        '403':
          description: Origin rejected
  /api/v1/shares/{id}/signals:
    get:
      summary: Poll signaling messages from the other participant
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  signals:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 50
                        data:
                          $ref: '#/components/schemas/Signal'
                    maxItems: 100
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - tutorSession: []
      - ticketToken: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: after
        schema:
          type: integer
          minimum: 0
          default: 0
    post:
      summary: Send SDP or ICE signaling
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signal'
      security:
      - tutorSession: []
      - ticketToken: []
      description: 'Learners send offers; tutors send answers. Media is peer-to-peer
        or relayed by TURN, never stored by this API. Inactive session: 410.'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    options:
      summary: CORS preflight
      responses:
        '204':
          description: Allowed origin; methods and headers returned
        '403':
          description: Origin rejected
  /api/v1/jobs:
    get:
      summary: Read demonstration job listings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                    maxItems: 100
                  demo:
                    type: boolean
                    enum:
                    - true
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    options:
      summary: CORS preflight
      responses:
        '204':
          description: Allowed origin; methods and headers returned
        '403':
          description: Origin rejected
  /api/v1/job-alerts:
    post:
      summary: Opt in and send a verification code
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  token:
                    type: string
                    maxLength: 100
                  verified:
                    type: boolean
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable or unconfigured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                  - telegram
                  - sms
                destination:
                  type: string
                  maxLength: 30
                language:
                  type: string
                  enum:
                  - en
                  - am
                  default: en
                keywords:
                  type: string
                  maxLength: 200
                consent:
                  type: boolean
                  enum:
                  - true
              required:
              - channel
              - destination
              - consent
      description: 'SMS destination must be E.164; Telegram destination is a numeric
        chat ID. Codes expire after ten minutes. Existing active subscription: 409.
        A configured delivery service is required.'
    delete:
      summary: Unsubscribe from alerts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  unsubscribed:
                    type: boolean
        '400':
          description: Invalid fields or JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin or role rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
