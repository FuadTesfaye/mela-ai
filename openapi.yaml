  /api/v1/signing/{id}/media:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Stream a reviewed signing video; unpublished media requires tutor authentication
      responses:
        "200":
          description: Success
        "401":
          description: Tutor authentication required
        "400":
          description: Invalid fields
        "409":
          description: Invalid lifecycle transition
        "503":
          description: Database or storage unavailable
        "206":
          description: Partial MP4 or WebM bytes with Content-Range
        "416":
          description: Unsatisfiable range
        "404":
          description: Missing or private video
      parameters:
        - name: Range
          in: header
          schema:
            type: string
    put:
      summary: Stream MP4/WebM to private storage, at most 128 MiB
      responses:
        "200":
          description: Success
        "401":
          description: Tutor authentication required
        "400":
          description: Invalid fields
        "409":
          description: Invalid lifecycle transition
        "503":
          description: Database or storage unavailable
        "413":
          description: Over 128 MiB
        "415":
          description: Unsupported media type
      security:
        - tutorSession: []
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
  /api/v1/translations:
    post:
      summary: Translate English lesson text to Amharic; prepared matches need no cloud consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetLanguage
                - items
              properties:
                sourceLanguage:
                  type: string
                  enum:
                    - en
                targetLanguage:
                  type: string
                  enum:
                    - am
                cloudConsent:
                  type: boolean
                  default: false
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: Unique IDs; at most 3000 total source characters.
                  items:
                    type: object
                    required:
                      - id
                      - text
                    properties:
                      id:
                        type: string
                        maxLength: 160
                      text:
                        type: string
                        maxLength: 3000
                      kind:
                        type: string
                        enum:
                          - text
                          - code
      responses:
        "200":
          description: Success; no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    enum:
                      - 1
                  sourceLanguage:
                    type: string
                    enum:
                      - en
                  targetLanguage:
                    type: string
                    enum:
                      - am
                  sourceRevision:
                    type: string
                    description: SHA-256 of canonical source items and glossary version
                  provenance:
                    type: string
                    enum:
                      - prepared
                      - ai-draft
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        text:
                          type: string
        "400": &id001
          description: Invalid input, missing consent, request limit or provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": *id001
        "413": *id001
        "429": *id001
        "503": *id001
    options:
      summary: CORS preflight
      responses:
        "204":
          description: Allowed origin
  /api/v1/speech:
    post:
      summary: Transcribe a consented short microphone recording without persisting audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - language
                - consent
                - mimeType
                - audio
              properties:
                language:
                  type: string
                  enum:
                    - en
                    - am
                consent:
                  type: boolean
                  enum:
                    - true
                mimeType:
                  type: string
                  enum:
                    - audio/webm
                    - audio/mp4
                    - audio/ogg
                    - audio/wav
                    - audio/mpeg
                audio:
                  type: string
                  format: byte
                  maxLength: 2800000
                  description: Base64 audio; decoded maximum 2 MB.
      responses:
        "200":
          description: Success; no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                    maxLength: 2000
                  language:
                    type: string
                    enum:
                      - en
                      - am
        "400": *id001
        "403": *id001
        "413": *id001
        "429": *id001
        "503": *id001
    options:
      summary: CORS preflight
      responses:
        "204":
          description: Allowed origin
