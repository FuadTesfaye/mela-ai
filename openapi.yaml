  /api/v1/transcriptions:
    options:
      summary: CORS preflight
      responses:
        "204":
          description: Allowed origin
    post:
      summary: Generate an English transcript from a public YouTube video
      description:
        Requires explicit consent. Sends the actual video URL to the server-side Gemini provider.
        Three requests per minute per process/address; successful results cached in-process for one hour.
        No generated transcript is returned when the provider fails. Transcripts are AI-generated and
        unreviewed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - videoUrl
                - consent
              properties:
                videoUrl:
                  type: string
                  format: uri
                  maxLength: 2000
                consent:
                  type: boolean
                  enum:
                    - true
                language:
                  type: string
                  enum:
                    - en
                  default: en
      responses:
        "200":
          description: Timestamped English transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "400":
          description: Invalid YouTube URL or missing consent
        "429":
          description: Rate limit exceeded
        "502":
          description: Gemini rejected the request or could not provide a usable transcript
        "503":
          description: Gemini key is not configured
