name: Validate MELA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mela
          POSTGRES_PASSWORD: mela-test
          POSTGRES_DB: mela_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mela -d mela_test" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://mela:mela-test@localhost:5432/mela_test
      TEST_DATABASE_URL: postgres://mela:mela-test@localhost:5432/mela_test
      APP_URL: http://localhost:3000
      ADMIN_PASSWORD: ci-only-password-not-for-deployment
      SESSION_SECRET: ci-only-session-secret-not-for-deployment-32
      E2E_DB: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: "" # Fixtures run before the integration database is migrated.
      - run: npm run test:widget
        env:
          DATABASE_URL: "" # Fixtures run before the integration database is migrated.
      - run: npm run test:integration
        env:
          DATABASE_URL: "" # Fixtures run before the integration database is migrated.
      - run: npm run db:migrate && npm run db:seed
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
